name: default-spec-driven-pipeline
phases:
  - id: memory-load
    owner: maestro-manager
    outputs: [verified-context, current-state, conflict-report]
    gate: memory-verified
  - id: discovery
    owner: maestro-product-analyst
    outputs: [project-spec, acceptance-contract, project-memory]
    gate: specification-approved
  - id: architecture
    owner: maestro-architect
    outputs: [architecture, adr, threat-model]
    gate: architecture-reviewed
  - id: experience
    owner: maestro-ui-ux-director
    outputs: [design-direction, responsive-rules, accessibility-plan]
    gate: experience-reviewed
  - id: scaffold
    owner: maestro-release-engineer
    outputs: [working-dev-loop, ci, environment-contract]
    gate: bootstrap-green
  - id: delivery
    owner: maestro-manager
    outputs: [vertical-slices, validation-evidence]
    gate: test-evidence-green
  - id: memory-checkpoint
    owner: maestro-manager
    outputs: [state, decisions, learnings, session-checkpoint, next-action]
    gate: resumable-context-ready
  - id: release
    owner: maestro-release-engineer
    outputs: [release-decision, rollback-plan, handoff]
    gate: release-approved
