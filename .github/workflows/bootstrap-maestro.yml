name: Bootstrap Vibe Code Maestro

on:
  push:
    branches:
      - agent/ai-development-os
    paths:
      - ".maestro-bootstrap.part-*"
      - ".github/workflows/bootstrap-maestro.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-development-os
          fetch-depth: 0

      - name: Verify bootstrap parts
        shell: bash
        run: |
          shopt -s nullglob
          parts=(.maestro-bootstrap.part-*)
          test "${#parts[@]}" -eq 13
          printf '%s\n' "${parts[@]}"

      - name: Reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          cat .maestro-bootstrap.part-* > /tmp/maestro-bootstrap.tar.gz.b64
          base64 --decode /tmp/maestro-bootstrap.tar.gz.b64 > /tmp/maestro-bootstrap.tar.gz
          gzip -t /tmp/maestro-bootstrap.tar.gz

      - name: Extract repository
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/maestro-bootstrap.tar.gz -C .
          chmod +x installers/*.sh scripts/*.sh

      - name: Validate Maestro structure
        run: python scripts/validate_maestro.py

      - name: Validate complete pack
        run: python scripts/validate_pack.py

      - name: Commit reconstructed repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f .maestro-bootstrap.part-*
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bootstrap Vibe Code Maestro"
          git push origin HEAD:agent/ai-development-os
